# Include this file from nginx's http{} context.
# Replace yourdomain.com, certificate paths, PHP-FPM socket and VLESS WS path.
# Matches the production host: AlmaLinux 9, nginx 1.20, php-fpm pool "ip-sub-node".
# In nginx.conf's main context set worker_rlimit_nofile 65536; and in events{}
# set worker_connections 8192; the service's LimitNOFILE must be at least 65536.
limit_req_zone $binary_remote_addr zone=vpn_sub_requests:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=vpn_sub_connections:10m;
map $uri $vpn_log_uri {
    "~^/sub/[a-fA-F0-9]{64}" /sub/[redacted];
    default $uri;
}
# Never log query strings, Authorization, Referer, or subscription tokens.
log_format vpn_safe '$remote_addr [$time_local] "$request_method $vpn_log_uri $server_protocol" $status $body_bytes_sent rt=$request_time urt=$upstream_response_time limit=$limit_req_status';

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com;
    access_log /var/log/nginx/vpn_access.log vpn_safe;

    # Subscription credentials are accepted over HTTPS only.
    location ~ ^/(sub(?:/|$)|api/vpn/) {
        return 404;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com;
    root /var/www/IP-sub-node;
    autoindex off;
    server_tokens off;
    access_log /var/log/nginx/vpn_access.log vpn_safe;

    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:VPN_TLS:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    fastcgi_hide_header X-Powered-By;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location = /sub/client.yaml {
        rewrite ^ /api/vpn/clash.php last;
    }

    # One URL for all nodes; auto.php selects the client configuration format.
    location = /sub {
        rewrite ^ /api/vpn/auto.php last;
    }

    location ~ "^/sub/[a-fA-F0-9]{64}/?$" {
        rewrite ^ /api/vpn/auto.php last;
    }

    location = /sub/mobile.json {
        rewrite ^ /api/vpn/hiddify.php last;
    }

    location ~ "^/sub/([a-f0-9]{64})/client\.yaml$" {
        rewrite "^/sub/([a-f0-9]{64})/client\.yaml$" /api/vpn/clash.php last;
    }

    location ~ "^/sub/([a-f0-9]{64})/mobile\.json$" {
        rewrite "^/sub/([a-f0-9]{64})/mobile\.json$" /api/vpn/hiddify.php last;
    }

    # Must match MOBILE_WS_PATH and Xray's wsSettings.path.
    location = /api/vless-ws {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:10086;
    }

    location ~ ^/api/vpn/(auto|clash|hiddify|sub|info)\.php$ {
        # Upstream errors can otherwise include the original token-bearing URI.
        error_log /dev/null;
        limit_req zone=vpn_sub_requests burst=20 nodelay;
        limit_conn vpn_sub_connections 20;
        limit_req_status 429;
        limit_conn_status 429;
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization if_not_empty;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php-fpm/ip-sub-node.sock;
    }

    # Every other path is outside the subscription service.
    location / {
        return 404;
    }
}
